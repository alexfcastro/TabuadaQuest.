name: Android Smoke Test

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'app/**'
      - '.github/workflows/android-smoke-test.yml'

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct app HTML
        shell: bash
        run: |
          mkdir -p app/src/main/assets
          cat ci/index.part* > /tmp/index.html.xz.b64
          base64 -d /tmp/index.html.xz.b64 > /tmp/index.html.xz
          xz -dc /tmp/index.html.xz > app/src/main/assets/index.html
          test -s app/src/main/assets/index.html

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.1" "platform-tools" "emulator" "system-images;android-33;google_apis;x86_64"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Run app on Android 13 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am force-stop com.tabuadaquest.app
            adb shell am start -W -n com.tabuadaquest.app/.MainActivity
            sleep 5
            adb shell dumpsys activity activities | grep -E "mResumedActivity|topResumedActivity|com.tabuadaquest.app" || true
            adb logcat -d -v brief > smoke-logcat.txt
            if grep -E "FATAL EXCEPTION|AndroidRuntime.*com.tabuadaquest.app|Process: com.tabuadaquest.app" smoke-logcat.txt; then
              echo "Application crash detected"
              cat smoke-logcat.txt
              exit 1
            fi
            if ! adb shell dumpsys activity activities | grep -q "com.tabuadaquest.app/.MainActivity"; then
              echo "MainActivity is not active"
              cat smoke-logcat.txt
              exit 1
            fi
            echo "Smoke test passed"

      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-smoke-logs
          path: smoke-logcat.txt
          retention-days: 7
